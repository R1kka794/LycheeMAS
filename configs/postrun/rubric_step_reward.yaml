# RaR -> MAS 步骤级奖励；不训练，不以局部奖励冒充因果贡献。
method: rubric_step_reward
credit_assigner: step_reward
task_goal: null                 # null 时必须由 trajectory.meta 提供真实目标
history_mode: explicit          # 每步 meta.visible_message_ids；全广播才用 all_previous
include_tool_steps: true
max_rubrics: 6
max_history_chars: 0            # 0=不限制；正数=超过即报错，不截断
max_output_chars: 0
reward_threshold: 0.5
aggregation: mean              # mean | sum；经 Attribution.meta 传递，公共接口不变
# rubric_llm/judge_llm 由调用者显式注入；不提供则报错。
# 不再支持 heuristic_judge、min_content_chars、use_external_reward。
# scripts/run_rar_step_reward.py 仅注入明确标记的 offline_replay 回调。
